project:
  type: website
  output-dir: ../docs/
  render:
    - "*.md"
    - "man/*.qmd"
    - "vignettes/GSEA_roundtrip.qmd"
    - "vignettes/PTM_enrichment.qmd"

website:
  title: "$ALTDOC_PACKAGE_NAME"
  repo-url: $ALTDOC_PACKAGE_URL_GITHUB
  repo-branch: main
  repo-actions: [source]
  navbar:
    search: true
    right:
      - icon: github
        href: $ALTDOC_PACKAGE_URL_GITHUB
        aria-label: $ALTDOC_PACKAGE_NAME GitHub
  sidebar:
    collapse-level: 1
    contents:
      - text: Home
        file: index.md
      - section: Articles
        contents:
          - text: clusterProfiler GSEA JSON round trip
            file: vignettes/GSEA_roundtrip.qmd
          - text: PTM enrichment
            file: vignettes/PTM_enrichment.qmd
      - section: $ALTDOC_MAN_BLOCK
      - text: News
        file: $ALTDOC_NEWS
      - text: License
        file: $ALTDOC_LICENSE

format:
  html:
    code-link: true
